[package]
name = "app"
description = "Cold Star — the Dioxus web/WASM frontend."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
sim = { path = "../sim" }
content = { path = "../content" }
dioxus = { version = "0.7.9", features = ["web"] }
gloo-timers = { version = "0.4.0", features = ["futures"] }
gloo-storage = "0.4.0"
js-sys = "0.3.102"
wasm-bindgen = "0.2.125"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.102", features = ["Window", "Location", "Navigator", "Clipboard", "Storage"] }
